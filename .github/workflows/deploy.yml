name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: spendwise-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Deploy CI-verified commit
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" bash -se -- "$SHA" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          cd /opt/finance-app
          test -f .env || { echo 'Missing /opt/finance-app/.env'; exit 1; }
          git fetch origin main
          git merge --ff-only "$sha"
          docker compose up -d --build --remove-orphans
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:8000/api/health
          REMOTE
