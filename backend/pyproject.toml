[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "spendwise-api"
version = "3.0.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi==0.115.0", "uvicorn==0.30.6", "pydantic==2.9.2", "sqlalchemy==2.0.35", "alembic==1.13.3", "psycopg[binary]==3.2.3", "celery[redis]==5.4.0", "kombu==5.5.4", "redis==5.2.1", "python-multipart==0.0.12", "openpyxl==3.1.5", "statsmodels==0.14.4", "pandas==2.2.3", "scipy==1.15.3", "httpx==0.28.1", "cryptography==46.0.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.7.1", "mypy==1.13.0"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
