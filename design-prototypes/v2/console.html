<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpendWise / 命令式</title><link rel="stylesheet" href="styles.css"></head><body class="console" data-design="console"><header class="co-head"><a href="index.html">SW<span>_</span></a><span>个人空间 / 工作台</span><button data-view="more">INDEX [M]</button></header><main class="co-main"><aside class="co-rail"><span>WORKSPACES</span><button data-view="ledger">/ ledger</button><button data-view="review">/ review</button><button data-view="plans">/ plan</button><button data-view="family">/ family</button><button data-view="sources">/ sources</button><p>DATA / STORED<br>导入仅用于更新账本。</p></aside><section class="co-center"><p class="co-overline">SPENDWISE ASSISTANT　/　READY</p><h1>一句问题，<br><span>进入整本账。</span></h1><p class="co-description">查询、解释、模拟与跳转，使用同一个输入入口。已有账本保持连接。</p><div class="co-input"><span>›</span><textarea id="co-question" rows="2" placeholder="输入问题，或输入 / 查看可用操作"></textarea><button data-send>运行 ↵</button></div><div class="co-shortcuts"><button data-fill="/ledger">/ledger <span>打开账本</span></button><button data-fill="/review">/review <span>核对事项</span></button><button data-fill="/plan">/plan <span>打开计划</span></button></div><div class="co-output"><div><span>SESSION 001</span><span>等待输入</span></div><p>对话结果会在此处展开，相关账本记录可从结果直接追溯。</p></div></section></main><footer class="co-foot">TAB / NAVIGATE　　ENTER / RUN　　ESC / CLOSE <span>STATIC PROTOTYPE · NO LIVE DATA</span></footer><div class="detail" hidden><button data-close aria-label="关闭详情">×</button><span class="detail-kicker">OUTPUT / RESULT</span><h2></h2><p></p><small>演示界面，不连接真实接口。</small></div><script src="prototype.js"></script></body></html>
