<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpendWise · 光晕</title><link rel="stylesheet" href="shared.css"></head><body class="prototype orbit" data-variant="orbit"><div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✳</span> SpendWise</a><span class="top-note">把复杂留给系统</span><a class="top-link" href="index.html">全部样板 ↗</a></header><main class="stage"><div class="stage-inner"><p class="eyebrow">YOUR MONEY, IN CONTEXT</p><h1>今天，你想<br><em>弄清楚什么？</em></h1><p class="lead">不用先学会看报表。说出一个问题，从账单和你在意的事情里寻找答案。</p><div class="steps" role="tablist" aria-label="使用步骤"><button class="step is-active" data-step="ask" role="tab" aria-selected="true"><b>01</b> 问一个问题</button><button class="step" data-step="connect" role="tab" aria-selected="false"><b>02</b> 放入账单</button><button class="step" data-step="reflect" role="tab" aria-selected="false"><b>03</b> 得到判断</button></div><section class="focus-panel" data-panel="ask"><label for="prompt-orbit">从这里开始</label><div class="composer"><textarea id="prompt-orbit" rows="2" placeholder="例如：这个月的钱，主要流向了哪里？"></textarea><button class="send" data-send aria-label="发送问题">↑</button></div><div class="suggestions"><span>也可以问</span><button data-prompt="如果我想每月多存一点，先看哪里？">每月多存一点</button><button data-prompt="哪些支出值得我再看一眼？">值得再看一眼</button></div><p class="demo-result" role="status" hidden></p></section><section class="focus-panel" data-panel="connect" hidden><span class="panel-kicker">不用逐笔记账</span><h2>把已有的账单带进来。</h2><p>从支付宝、微信或银行导出文件后，选择文件即可开始核对；重要的歧义再由你决定。</p><label class="upload" for="file-orbit">选择账单文件 <span>↗</span></label><input id="file-orbit" type="file" accept=".csv,.txt,.xlsx" data-file><p class="file-name" role="status">尚未选择文件</p></section><section class="focus-panel" data-panel="reflect" hidden><span class="panel-kicker">有依据，也有边界</span><h2>先判断什么值得关注。</h2><p>展示变化、证据和覆盖范围；没有足够信息时，只问一个会改变结论的问题。</p><div class="insight-preview"><span class="signal"></span><div><strong>这笔变化需要处理吗？</strong><small>先看影响，再决定要不要行动。</small></div><span>↗</span></div></section></div></main><footer class="bottomline"><span>01 / 光晕</span><span>静态交互样板 · 无真实账本连接</span><span>轻盈 · 连续 · 聚焦</span></footer><script src="shared.js"></script></body></html>
